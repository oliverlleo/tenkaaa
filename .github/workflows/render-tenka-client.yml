name: Verify TENKA evolution

on:
  push:
    branches:
      - evolution-traco-ao-habitar
    paths:
      - 'index.html'
      - 'styles.css'
      - 'script.js'
      - '.github/workflows/render-tenka-client.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 > /tmp/tenka-server.log 2>&1 &
          sleep 2

      - name: Verify desktop and mobile
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('tenka-captures', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const viewports = [
            { name: 'desktop', width: 1920, height: 1080 },
            { name: 'mobile', width: 390, height: 844 }
          ];

          const required = [
            '.hero', '.hero-blueprint', '.principle', '.journey', '.projects',
            '.transformation', '.services', '.matter', '.process', '.contact'
          ];

          for (const vp of viewports) {
            const page = await browser.newPage({ viewport: { width: vp.width, height: vp.height }, deviceScaleFactor: 1 });
            const pageErrors = [];
            const failedRequests = [];
            page.on('pageerror', e => pageErrors.push(e.message));
            page.on('requestfailed', r => failedRequests.push(`${r.url()} :: ${r.failure()?.errorText || 'failed'}`));

            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(1600);
            await page.evaluate(() => document.querySelector('.loader')?.classList.add('is-done'));

            for (const selector of required) {
              if (!(await page.$(selector))) throw new Error(`${vp.name}: missing selector ${selector}`);
            }

            await page.evaluate(() => {
              document.querySelectorAll('img').forEach(img => { img.loading = 'eager'; });
            });

            const totalHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < totalHeight; y += Math.max(500, Math.floor(vp.height * .75))) {
              await page.evaluate(v => window.scrollTo(0, v), y);
              await page.waitForTimeout(75);
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(700);

            const metrics = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth,
              scrollHeight: document.documentElement.scrollHeight,
              bodyHeight: document.body.scrollHeight
            }));
            if (metrics.scrollWidth > metrics.innerWidth + 2) {
              throw new Error(`${vp.name}: horizontal overflow ${metrics.scrollWidth}px > ${metrics.innerWidth}px`);
            }

            const broken = await page.$$eval('img', imgs => imgs.filter(i => !i.complete || i.naturalWidth === 0).map(i => i.currentSrc || i.src));
            if (broken.length) throw new Error(`${vp.name}: ${broken.length} broken images\n${broken.join('\n')}`);
            if (pageErrors.length) throw new Error(`${vp.name}: page errors\n${pageErrors.join('\n')}`);

            const sections = ['.hero', '.principle', '.journey', '.projects', '.transformation', '.services', '.matter', '.process', '.contact'];
            for (let i = 0; i < sections.length; i++) {
              const selector = sections[i];
              const y = await page.$eval(selector, el => Math.max(0, el.offsetTop + Math.min(el.offsetHeight * .35, 700) - innerHeight * .35));
              await page.evaluate(v => window.scrollTo(0, v), y);
              await page.waitForTimeout(350);
              await page.screenshot({ path: `tenka-captures/${vp.name}-${String(i + 1).padStart(2, '0')}.png`, fullPage: false });
            }

            fs.writeFileSync(`tenka-captures/${vp.name}-verification.json`, JSON.stringify({
              viewport: vp,
              metrics,
              brokenImages: broken,
              pageErrors,
              failedRequests
            }, null, 2));
            await page.close();
          }

          await browser.close();
          EOF
          node verify.mjs

      - name: Upload verification captures
        uses: actions/upload-artifact@v4
        with:
          name: tenka-evolution-verification
          path: tenka-captures/
          if-no-files-found: error
          retention-days: 3
