name: Verify TENKA cinematic experience

on:
  push:
    branches:
      - tenka-cinematic-experience
    paths:
      - 'index.html'
      - 'styles.css'
      - 'css/**'
      - 'script.js'
      - 'src/**'
      - '.github/workflows/render-tenka-client.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 > /tmp/tenka-server.log 2>&1 &
          sleep 2

      - name: Verify cinematic experience
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('tenka-verification', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const results = [];
          const critical = ['.hero-title','.manifesto-title','.story-copy','.transformation-stage','.project-shot','.service-line','.process-step','.outro-copy'];

          async function prepare(page){
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil:'domcontentloaded', timeout:120000 });
            await page.waitForTimeout(2200);
            await page.evaluate(() => document.querySelector('.boot')?.classList.add('is-done'));
            await page.waitForTimeout(500);
            const missing = await page.evaluate(selectors => selectors.filter(s => !document.querySelector(s)), critical);
            if(missing.length) throw new Error(`Missing critical selectors: ${missing.join(', ')}`);
          }

          async function yFor(page, selector, progress=0){
            return page.evaluate(({selector,progress}) => {
              const el=document.querySelector(selector);
              if(!el) throw new Error(`Missing selector ${selector}`);
              const travel=Math.max(0,el.offsetHeight-innerHeight);
              return Math.max(0,el.offsetTop+travel*progress);
            },{selector,progress});
          }

          async function shot(page,name,y,settle=700){
            await page.evaluate(v=>window.scrollTo(0,v),y);
            await page.waitForTimeout(settle);
            await page.screenshot({path:`tenka-verification/${name}.png`,fullPage:false});
          }

          async function runViewport(name,viewport){
            const page=await browser.newPage({viewport,deviceScaleFactor:1});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            await prepare(page);
            const overflow=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth,delta:document.documentElement.scrollWidth-innerWidth}));
            if(overflow.delta>3) throw new Error(`${name}: horizontal overflow ${overflow.delta}px`);
            const broken=await page.$$eval('img',imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src));
            if(broken.length) throw new Error(`${name}: ${broken.length} broken images`);
            const globals=await page.evaluate(()=>({gsap:!!window.gsap,scrollTrigger:!!window.ScrollTrigger,bootDone:document.querySelector('.boot')?.classList.contains('is-done')}));
            if(!globals.gsap||!globals.scrollTrigger) throw new Error(`${name}: GSAP runtime unavailable`);

            if(name==='desktop'){
              await shot(page,'desktop-01-hero',0,900);
              await shot(page,'desktop-02-manifesto',await yFor(page,'.manifesto',.46));
              await shot(page,'desktop-03-entender',await yFor(page,'.story',.12));
              await shot(page,'desktop-04-traduzir',await yFor(page,'.story',.49));
              await shot(page,'desktop-05-habitar',await yFor(page,'.story',.82));
              await shot(page,'desktop-06-transformacao',await yFor(page,'.transformation',.58));
              await shot(page,'desktop-07-projeto-01',await yFor(page,'.projects',.23));
              await shot(page,'desktop-08-projeto-03',await yFor(page,'.projects',.66));
              await shot(page,'desktop-09-servicos',await yFor(page,'.services',.51));
              await shot(page,'desktop-10-filosofia',await yFor(page,'.philosophy',.52));
              await shot(page,'desktop-11-processo',await yFor(page,'.process',.63));
              await shot(page,'desktop-12-epilogo',await yFor(page,'.outro',.38));
              await page.evaluate(()=>document.querySelector('[data-open-project="0"]')?.click());
              await page.waitForTimeout(700);
              const open=await page.$eval('.project-modal',el=>el.classList.contains('is-open')&&el.getAttribute('aria-hidden')==='false');
              if(!open) throw new Error('desktop: project modal did not open');
              await page.screenshot({path:'tenka-verification/desktop-13-project-modal.png',fullPage:false});
              await page.keyboard.press('Escape');
              await page.waitForTimeout(450);
            }else{
              await shot(page,'mobile-01-hero',0,700);
              await shot(page,'mobile-02-story',await yFor(page,'.story',.49));
              await shot(page,'mobile-03-projects',await yFor(page,'.projects',.54));
              await shot(page,'mobile-04-services',await yFor(page,'.services',.55));
              await shot(page,'mobile-05-epilogue',await yFor(page,'.outro',.4));
            }
            if(pageErrors.length) throw new Error(`${name}: page errors: ${pageErrors.join(' | ')}`);
            results.push({name,viewport,overflow,brokenImages:broken,pageErrors,globals});
            await page.close();
          }

          await runViewport('desktop',{width:1920,height:1080});
          await runViewport('mobile',{width:390,height:844});

          const reducedPage=await browser.newPage({viewport:{width:1440,height:900}});
          await reducedPage.emulateMedia({reducedMotion:'reduce'});
          const reducedErrors=[];reducedPage.on('pageerror',e=>reducedErrors.push(e.message));
          await prepare(reducedPage);
          const reducedState=await reducedPage.evaluate(()=>({
            overflow:document.documentElement.scrollWidth-innerWidth,
            sticky:getComputedStyle(document.querySelector('.story-sticky')).position,
            copies:[...document.querySelectorAll('.story-copy')].map(el=>getComputedStyle(el).opacity),
            sceneHeight:document.querySelector('.story').getBoundingClientRect().height
          }));
          if(reducedState.overflow>3) throw new Error(`reduced-motion: horizontal overflow ${reducedState.overflow}px`);
          if(reducedState.copies.some(v=>Number(v)<.95)) throw new Error('reduced-motion: story content hidden');
          if(reducedErrors.length) throw new Error(`reduced-motion page errors: ${reducedErrors.join(' | ')}`);
          await reducedPage.screenshot({path:'tenka-verification/reduced-motion.png',fullPage:true});
          results.push({name:'reduced-motion',viewport:{width:1440,height:900},state:reducedState,pageErrors:reducedErrors});
          await reducedPage.close();

          fs.writeFileSync('tenka-verification/verification.json',JSON.stringify({branch:'tenka-cinematic-experience',results},null,2));
          await browser.close();
          EOF
          node verify.mjs

      - name: Upload verification captures
        uses: actions/upload-artifact@v4
        with:
          name: tenka-cinematic-verification
          path: tenka-verification/
          if-no-files-found: error
          retention-days: 3
